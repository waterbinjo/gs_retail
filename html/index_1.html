<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../css/reset_1.css">
    <link rel="stylesheet" href="../css/style_1.css">
    <title>Document</title>
  </head>
  <body>
    <div id="wrap">
      <div class="container">
        <div class="member_box">
          <div class="title">GS리테일 멤버십</div>
          <div class="member_content">
            <img src="../img/sweet.jpg" alt="스위트 아메리카노 이미지">

          <p>TOP스위트 아메리카노</p>

        </div>

          <div class="title">GS리테일 Youtube</div>
          <div class="youtube_content">
            <img src="../img/youtube_icon.jpg" alt="">
            <p>GS리테일의 공식<br>Youtube 채널</p>
            <P>다양하고 재미있는 GS리테일만의<br> 동영상을 확인해 보세요</P>
          </div>

        </div>

        <div class="service_box">
          <div class="title">GS리테일 빠른 서비스</div>
          <div class="service_content">
            <div class="service_content01">
              <div class="detail_box">
                <img id="box_01" src="../img/check.jpg" alt="">
                <p>출석체크</p>
                <p>매일매일 출석체크!</p>
              </div>
            </div>
            <div class="service_content02">
              <div class="detail_box">
                <img id="box_02" src="../img/consult.jpg" alt="">
                <p>입점상담</p>
                <p>GS리테일 입점안내</p>
              </div>
            </div>
            <div class="service_content03">
              <div class="detail_box">
                <img id="box_03" src="../img/membership.jpg" alt="">
                <p>멤버십 카드등록</p>
                <p>풍성한 적립과<br>실속있는 혜택!</p>
              </div>
            </div>
            <div class="service_content04">
              <div class="detail_box">
                <img id="box_03" src="../img/recurt.jpg" alt="">
                <p>채용안내</p>
                <p>꿈과 열정으로<br>도전하세요.</p>
              </div>
            </div>
          </div>
        </div>

        <div class="point_box">
          <img src="../img/gs_point.jpg" alt="포인트 박스 이미지">
          <p>GS&POINT</p>
          <P>무한 혜택 알아보기!</P>
        </div>

        <div class="notice_box">
          <P>공지사항</P>
          <ul class="notice_lnb">
            <li><a href="#">[GS25] 나만의 냉장고 리뉴얼 오픈 안내</a></li>
            <li><a href="#">[전체] 2월의 매일매일 달콤한 사랑고백</a></li>
          </ul>
        </div>
      </div>
    </div>
